<!DOCTYPE html>
<html lang="id" class="h-full bg-stone-100 text-stone-800">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Sekam Bakar Subang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="h-full bg-stone-100 text-stone-800 p-4 sm:p-6 antialiased">

  <div class="max-w-5xl mx-auto space-y-6">

    <!-- Header Navigation -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-stone-50 p-5 rounded-3xl border border-stone-200/80 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-emerald-800 text-stone-100 flex items-center justify-center shadow-md shadow-emerald-900/10">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M17 8C8 10 59 16.17 3.83 12 1.17 12 1 12 1c0 0 .17.17 1 3.83C5 20.83 11.17 23 17 23c6 0 6-5 6-15 0 0-1 0-6 0zm-5 11c-3.5 0-6.8-1.4-9.2-3.8C5.2 12.8 8.5 11.4 12 11.4c3.5 0 6.8 1.4 9.2 3.8-2.4 2.4-5.7 3.8-9.2 3.8z"/></svg>
        </div>
        <div>
          <h1 class="text-base font-bold text-stone-900">Panel Kelola Toko & Gudang</h1>
          <p class="text-xs text-stone-500">Sekam Bakar Subang — Realtime Dashboard</p>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="flex bg-stone-200/80 p-1 rounded-2xl gap-1 self-start sm:self-auto">
        <button id="tab-btn-orders" onclick="switchMainTab('orders')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all bg-stone-50 text-stone-900 shadow-sm">
          Kelola Pesanan
        </button>
        <button id="tab-btn-products" onclick="switchMainTab('products')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all text-stone-600 hover:text-stone-900">
          Kelola Katalog
        </button>
      </div>
    </header>

    <!-- SECTION 1: KELOLA PESANAN (KOLOM DENGAN STATUS CLEAR) -->
    <section id="section-orders" class="space-y-4">
      
      <!-- Sub-Filter Bar -->
      <div class="flex flex-wrap items-center justify-between gap-3 bg-stone-50 p-3 rounded-2xl border border-stone-200/80">
        <span class="text-xs font-bold text-stone-700 uppercase tracking-wider pl-1">Filter Pesanan:</span>
        <div class="flex bg-stone-200/60 p-1 rounded-xl gap-1 text-xs">
          <button id="subtab-btn-pending" onclick="setOrderFilter('pending')" class="px-3 py-1.5 rounded-lg font-bold bg-amber-600 text-stone-100 shadow-sm">
            🟡 Menunggu (<span id="count-pending">0</span>)
          </button>
          <button id="subtab-btn-ready" onclick="setOrderFilter('ready')" class="px-3 py-1.5 rounded-lg font-bold text-stone-600 hover:text-stone-900">
            🟢 Siap Diambil (<span id="count-ready">0</span>)
          </button>
          <button id="subtab-btn-done" onclick="setOrderFilter('done')" class="px-3 py-1.5 rounded-lg font-bold text-stone-600 hover:text-stone-900">
            🔘 Selesai (<span id="count-done">0</span>)
          </button>
          <button id="subtab-btn-all" onclick="setOrderFilter('all')" class="px-3 py-1.5 rounded-lg font-bold text-stone-600 hover:text-stone-900">
            Semua
          </button>
        </div>
      </div>

      <!-- Container Pesanan -->
      <div id="orders-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- SECTION 2: KELOLA KATALOG PRODUK -->
    <section id="section-products" class="hidden space-y-6">
      <div class="bg-stone-50 p-5 rounded-3xl border border-stone-200/80 shadow-sm space-y-4">
        <h2 class="text-sm font-bold text-stone-900 flex items-center gap-2">
          <svg class="w-4 h-4 text-emerald-800 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Tambah Produk Baru
        </h2>

        <form id="form-add-product" onsubmit="handleAddProduct(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">Nama Produk</label>
            <input type="text" id="prod-name" placeholder="Contoh: Sekam Bakar 5 kg" required class="w-full bg-stone-100 border border-stone-300 rounded-xl px-3.5 py-2 text-xs text-stone-900 focus:outline-none focus:border-emerald-700">
          </div>
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">Harga (Rp)</label>
            <input type="number" id="prod-price" placeholder="Contoh: 22000" required class="w-full bg-stone-100 border border-stone-300 rounded-xl px-3.5 py-2 text-xs text-stone-900 focus:outline-none focus:border-emerald-700">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-semibold text-stone-700 mb-1">Deskripsi Singkat</label>
            <input type="text" id="prod-desc" placeholder="Contoh: Kemasan sedang untuk pekarangan rumah" required class="w-full bg-stone-100 border border-stone-300 rounded-xl px-3.5 py-2 text-xs text-stone-900 focus:outline-none focus:border-emerald-700">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-semibold text-stone-700 mb-1">URL Foto Produk (Gambar Internet)</label>
            <input type="url" id="prod-image" placeholder="https://images.unsplash.com/..." required class="w-full bg-stone-100 border border-stone-300 rounded-xl px-3.5 py-2 text-xs text-stone-900 focus:outline-none focus:border-emerald-700">
          </div>
          <div class="sm:col-span-2">
            <button type="submit" id="btn-save-prod" class="w-full py-2.5 bg-emerald-800 hover:bg-emerald-700 text-stone-100 font-bold text-xs rounded-xl transition-all shadow-md shadow-emerald-900/10">
              Simpan Produk ke Katalog
            </button>
          </div>
        </form>
      </div>

      <div class="space-y-3">
        <h2 class="text-xs font-bold uppercase tracking-wider text-stone-500">Daftar Produk di Web Pembeli</h2>
        <div id="products-admin-container" class="space-y-3"></div>
      </div>
    </section>

  </div>

  <!-- MODAL EDIT PRODUK -->
  <div id="edit-product-modal" class="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-stone-50 border border-stone-200/80 w-full max-w-md rounded-3xl p-5 space-y-4 shadow-2xl animate-in fade-in duration-200">
      <div class="flex justify-between items-center pb-3 border-b border-stone-200">
        <h2 class="text-sm font-bold text-stone-900">Edit Produk Katalog</h2>
        <button onclick="closeEditModal()" class="w-8 h-8 rounded-full bg-stone-200/70 hover:bg-stone-200 flex items-center justify-center text-stone-600">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <form id="form-edit-product" onsubmit="handleUpdateProduct(event)" class="space-y-3">
        <input type="hidden" id="edit-prod-id">
        <div>
          <label class="block text-xs font-semibold text-stone-700 mb-1">Nama Produk</label>
          <input type="text" id="edit-prod-name" required class="w-full bg-stone-100 border border-stone-300 rounded-xl px-3.5 py-2 text-xs text-stone-900 focus:outline-none focus:border-emerald-700">
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-700 mb-1">Harga (Rp)</label>
          <input type="number" id="edit-prod-price" required class="w-full bg-stone-100 border border-stone-300 rounded-xl px-3.5 py-2 text-xs text-stone-900 focus:outline-none focus:border-emerald-700">
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-700 mb-1">Deskripsi Singkat</label>
          <input type="text" id="edit-prod-desc" required class="w-full bg-stone-100 border border-stone-300 rounded-xl px-3.5 py-2 text-xs text-stone-900 focus:outline-none focus:border-emerald-700">
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-700 mb-1">URL Foto Produk</label>
          <input type="url" id="edit-prod-image" required class="w-full bg-stone-100 border border-stone-300 rounded-xl px-3.5 py-2 text-xs text-stone-900 focus:outline-none focus:border-emerald-700">
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="closeEditModal()" class="w-1/3 py-2.5 bg-stone-200 hover:bg-stone-300 text-stone-700 font-bold text-xs rounded-xl transition-colors">
            Batal
          </button>
          <button type="submit" id="btn-update-prod" class="w-2/3 py-2.5 bg-emerald-800 hover:bg-emerald-700 text-stone-100 font-bold text-xs rounded-xl transition-all shadow-md shadow-emerald-900/10">
            Simpan Perubahan
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { initializeFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD9IZnOoj92mjDVXnoI32NfTqxBrUMZAsg",
      authDomain: "sekambakarsubang.firebaseapp.com",
      projectId: "sekambakarsubang",
      storageBucket: "sekambakarsubang.firebasestorage.app",
      messagingSenderId: "743733680640",
      appId: "1:743733680640:web:84ab4ca233c8dcf65bd6e5",
      measurementId: "G-QXJKW2R0HG"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, { experimentalForceLongPolling: true, useFetchStreams: false });

    let currentOrderFilter = 'pending';
    let allOrdersData = [];

    // TAB SWITCHING UTAMA
    window.switchMainTab = function(tab) {
      const btnOrders = document.getElementById('tab-btn-orders');
      const btnProducts = document.getElementById('tab-btn-products');
      const secOrders = document.getElementById('section-orders');
      const secProducts = document.getElementById('section-products');

      if (tab === 'orders') {
        btnOrders.className = "px-4 py-2 rounded-xl text-xs font-bold transition-all bg-stone-50 text-stone-900 shadow-sm";
        btnProducts.className = "px-4 py-2 rounded-xl text-xs font-bold transition-all text-stone-600 hover:text-stone-900";
        secOrders.classList.remove('hidden');
        secProducts.classList.add('hidden');
      } else {
        btnProducts.className = "px-4 py-2 rounded-xl text-xs font-bold transition-all bg-stone-50 text-stone-900 shadow-sm";
        btnOrders.className = "px-4 py-2 rounded-xl text-xs font-bold transition-all text-stone-600 hover:text-stone-900";
        secProducts.classList.remove('hidden');
        secOrders.classList.add('hidden');
      }
    };

    // SUB-FILTER ORDER STATUS
    window.setOrderFilter = function(filterType) {
      currentOrderFilter = filterType;

      const btnPending = document.getElementById('subtab-btn-pending');
      const btnReady = document.getElementById('subtab-btn-ready');
      const btnDone = document.getElementById('subtab-btn-done');
      const btnAll = document.getElementById('subtab-btn-all');

      btnPending.className = "px-3 py-1.5 rounded-lg font-bold text-stone-600 hover:text-stone-900";
      btnReady.className = "px-3 py-1.5 rounded-lg font-bold text-stone-600 hover:text-stone-900";
      btnDone.className = "px-3 py-1.5 rounded-lg font-bold text-stone-600 hover:text-stone-900";
      btnAll.className = "px-3 py-1.5 rounded-lg font-bold text-stone-600 hover:text-stone-900";

      if (filterType === 'pending') {
        btnPending.className = "px-3 py-1.5 rounded-lg font-bold bg-amber-600 text-stone-100 shadow-sm";
      } else if (filterType === 'ready') {
        btnReady.className = "px-3 py-1.5 rounded-lg font-bold bg-emerald-800 text-stone-100 shadow-sm";
      } else if (filterType === 'done') {
        btnDone.className = "px-3 py-1.5 rounded-lg font-bold bg-stone-700 text-stone-100 shadow-sm";
      } else {
        btnAll.className = "px-3 py-1.5 rounded-lg font-bold bg-stone-800 text-stone-100 shadow-sm";
      }

      renderOrdersList();
    };

    // 1. MONITOR PESANAN MASUK
    const qOrders = query(collection(db, "orders"), orderBy("createdAt", "desc"));
    let initialLoad = true;
    const alertSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    onSnapshot(qOrders, (snapshot) => {
      allOrdersData = [];

      if (!initialLoad && snapshot.docChanges().some(change => change.type === 'added')) {
        alertSound.play().catch(() => {});
      }
      initialLoad = false;

      snapshot.forEach((docSnap) => {
        allOrdersData.push({ id: docSnap.id, ...docSnap.data() });
      });

      // Update Hitungan Counter
      const pendingCount = allOrdersData.filter(o => o.status === 'Menunggu Konfirmasi').length;
      const readyCount = allOrdersData.filter(o => o.status === 'Siap Diambil').length;
      const doneCount = allOrdersData.filter(o => o.status === 'Selesai').length;

      document.getElementById('count-pending').innerText = pendingCount;
      document.getElementById('count-ready').innerText = readyCount;
      document.getElementById('count-done').innerText = doneCount;

      renderOrdersList();
    });

    function renderOrdersList() {
      const container = document.getElementById('orders-container');
      container.innerHTML = '';

      let filtered = allOrdersData;
      if (currentOrderFilter === 'pending') {
        filtered = allOrdersData.filter(o => o.status === 'Menunggu Konfirmasi');
      } else if (currentOrderFilter === 'ready') {
        filtered = allOrdersData.filter(o => o.status === 'Siap Diambil');
      } else if (currentOrderFilter === 'done') {
        filtered = allOrdersData.filter(o => o.status === 'Selesai');
      }

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-xs text-stone-500 col-span-full text-center py-12 bg-stone-50 rounded-2xl border border-stone-200/60">Tidak ada pesanan di kategori ini...</p>`;
        return;
      }

      filtered.forEach((data) => {
        const docId = data.id;

        const isUnverified = data.status === 'Menunggu Konfirmasi';
        const isReady = data.status === 'Siap Diambil';
        const isDone = data.status === 'Selesai';

        const card = document.createElement('div');
        card.className = `p-4 rounded-2xl border ${isUnverified ? 'bg-amber-50/90 border-amber-300 shadow-md shadow-amber-500/5' : isDone ? 'bg-stone-50/50 border-stone-200 opacity-70' : 'bg-emerald-50/60 border-emerald-300'} space-y-3`;

        let itemsHTML = data.items ? data.items.map(i => `<div class="flex justify-between text-xs text-stone-700"><span>${i.name} <strong class="text-stone-900">x${i.qty}</strong></span></div>`).join('') : '';

        card.innerHTML = `
          <div class="flex justify-between items-start border-b border-stone-200/80 pb-2">
            <div>
              <span class="text-xs font-bold ${isUnverified ? 'text-amber-900' : isReady ? 'text-emerald-800' : 'text-stone-600'}">Jadwal Ambil: ${data.pickupTime || '-'}</span>
              <h3 class="text-xs font-bold text-stone-900 mt-0.5">${data.customerName || 'Pembeli'} (${data.phone || '-'})</h3>
            </div>
            <span class="px-2.5 py-0.5 text-[10px] rounded-full font-bold ${isUnverified ? 'bg-amber-200 text-amber-900 border border-amber-300' : isReady ? 'bg-emerald-200 text-emerald-900 border border-emerald-300' : 'bg-stone-200 text-stone-600'}">
              ${data.status}
            </span>
          </div>

          <div class="space-y-1">${itemsHTML}</div>

          <div class="pt-2 border-t border-stone-200/80 flex justify-between items-center">
            <div>
              <p class="text-[10px] text-stone-500">${data.paymentMethod} • Rp ${(data.totalAmount || 0).toLocaleString('id-ID')}</p>
              <p class="text-[11px] font-bold ${data.paymentStatus.includes('Lunas') ? 'text-emerald-800' : 'text-amber-800'}">${data.paymentStatus}</p>
            </div>

            <div class="flex items-center gap-1.5">
              ${isUnverified ? `
                <button onclick="markReady('${docId}')" class="px-3 py-1.5 bg-emerald-800 hover:bg-emerald-700 text-stone-100 text-xs rounded-xl font-bold transition-all shadow-sm">
                  Konfirmasi & Siap
                </button>
              ` : isReady ? `
                <button onclick="markDone('${docId}')" class="px-3 py-1.5 bg-stone-800 hover:bg-stone-700 text-stone-100 text-xs rounded-xl font-bold transition-all shadow-sm">
                  Tandai Selesai
                </button>
              ` : ''}

              <!-- Tombol Hapus Pesanan -->
              <button onclick="deleteOrder('${docId}')" class="p-1.5 rounded-xl text-stone-400 hover:text-rose-600 hover:bg-rose-50 transition-colors" title="Hapus Pesanan Ini">
                <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.markReady = async function(id) {
      await updateDoc(doc(db, "orders", id), { status: "Siap Diambil", paymentStatus: "Lunas / Disetujui" });
    };

    window.markDone = async function(id) {
      await updateDoc(doc(db, "orders", id), { status: "Selesai" });
    };

    window.deleteOrder = async function(id) {
      if (confirm("Hapus catatan pesanan ini?")) {
        try {
          await deleteDoc(doc(db, "orders", id));
        } catch (err) {
          alert("Gagal menghapus pesanan: " + err.message);
        }
      }
    };

    // 2. LISTEN REALTIME KATALOG PRODUK
    onSnapshot(collection(db, "products"), (snapshot) => {
      const container = document.getElementById('products-admin-container');
      container.innerHTML = '';

      if (snapshot.empty) {
        container.innerHTML = `<p class="text-xs text-stone-500 text-center py-6">Belum ada produk di katalog.</p>`;
        return;
      }

      snapshot.forEach((docSnap) => {
        const p = docSnap.data();
        const pId = docSnap.id;
        const isAvail = p.isAvailable !== false;

        const safeName = (p.name || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        const safeDesc = (p.desc || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        const safeImage = (p.image || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');

        const card = document.createElement('div');
        card.className = 'p-3.5 bg-stone-50 border border-stone-200/80 rounded-2xl flex items-center justify-between gap-3 shadow-sm';
        card.innerHTML = `
          <div class="flex items-center gap-3 min-w-0">
            <img src="${p.image}" class="w-12 h-12 rounded-xl object-cover bg-stone-200 shrink-0 border border-stone-200">
            <div class="min-w-0">
              <h3 class="text-xs font-bold text-stone-900 truncate">${p.name}</h3>
              <p class="text-[11px] font-bold text-emerald-800">Rp ${(p.price || 0).toLocaleString('id-ID')}</p>
            </div>
          </div>

          <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="toggleStock('${pId}', ${!isAvail})" class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold transition-all border ${isAvail ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : 'bg-rose-100 text-rose-800 border-rose-300'}">
              ${isAvail ? 'Tersedia' : 'Kosong'}
            </button>

            <!-- Tombol Edit -->
            <button onclick="openEditModal('${pId}', '${safeName}', ${p.price || 0}, '${safeDesc}', '${safeImage}')" class="p-2 rounded-xl text-stone-600 hover:text-emerald-800 hover:bg-emerald-50 transition-colors" title="Edit Produk">
              <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            </button>

            <!-- Tombol Hapus Produk -->
            <button onclick="deleteProduct('${pId}')" class="p-2 rounded-xl text-stone-400 hover:text-rose-600 hover:bg-rose-50 transition-colors" title="Hapus Produk">
              <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    });

    // TAMBAH PRODUK BARU
    window.handleAddProduct = async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-save-prod');
      btn.innerText = "Saving..."; btn.disabled = true;

      try {
        await addDoc(collection(db, "products"), {
          name: document.getElementById('prod-name').value.trim(),
          price: parseInt(document.getElementById('prod-price').value),
          desc: document.getElementById('prod-desc').value.trim(),
          image: document.getElementById('prod-image').value.trim(),
          isAvailable: true
        });
        document.getElementById('form-add-product').reset();
        alert("Produk berhasil ditambahkan!");
      } catch (err) {
        alert("Gagal menambahkan produk: " + err.message);
      } finally {
        btn.innerText = "Simpan Produk ke Katalog"; btn.disabled = false;
      }
    };

    window.toggleStock = async function(id, status) {
      await updateDoc(doc(db, "products", id), { isAvailable: status });
    };

    window.openEditModal = function(id, name, price, desc, image) {
      document.getElementById('edit-prod-id').value = id;
      document.getElementById('edit-prod-name').value = name;
      document.getElementById('edit-prod-price').value = price;
      document.getElementById('edit-prod-desc').value = desc;
      document.getElementById('edit-prod-image').value = image;

      document.getElementById('edit-product-modal').classList.remove('hidden');
      document.getElementById('edit-product-modal').classList.add('flex');
    };

    window.closeEditModal = function() {
      document.getElementById('edit-product-modal').classList.add('hidden');
      document.getElementById('edit-product-modal').classList.remove('flex');
    };

    window.handleUpdateProduct = async function(e) {
      e.preventDefault();
      const id = document.getElementById('edit-prod-id').value;
      const btn = document.getElementById('btn-update-prod');
      btn.innerText = "Menyimpan..."; btn.disabled = true;

      try {
        await updateDoc(doc(db, "products", id), {
          name: document.getElementById('edit-prod-name').value.trim(),
          price: parseInt(document.getElementById('edit-prod-price').value),
          desc: document.getElementById('edit-prod-desc').value.trim(),
          image: document.getElementById('edit-prod-image').value.trim()
        });
        closeEditModal();
        alert("Produk berhasil diperbarui!");
      } catch (err) {
        alert("Gagal mengupdate produk: " + err.message);
      } finally {
        btn.innerText = "Simpan Perubahan"; btn.disabled = false;
      }
    };

    // HAPUS PRODUK KATALOG
    window.deleteProduct = async function(id) {
      if (confirm("Apakah kamu yakin ingin menghapus produk ini dari katalog?")) {
        try {
          await deleteDoc(doc(db, "products", id));
          alert("Produk berhasil dihapus!");
        } catch (err) {
          alert("Gagal menghapus produk: " + err.message);
        }
      }
    };
  </script>
</body>
</html>
